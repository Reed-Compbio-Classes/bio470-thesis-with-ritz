name: CI — Build Jekyll site (no deploy)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 1

      # Keep this so the build uses the same base_path as your deploy workflow
      - name: Configure Pages (for base_path)
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Optional: attach the built site to the CI run for inspection
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site
          retention-days: 7
